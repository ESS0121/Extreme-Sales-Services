<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technician Panel | Extreme AC Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
      <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div>
          <h1 class="text-3xl font-bold text-gray-800">My Jobs</h1>
          <p class="text-gray-600">Active assignments and schedules</p>
        </div>
        <div class="flex gap-2">
          <button id="refreshBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold shadow transition">
            Refresh List
          </button>
          <button onclick="localStorage.clear(); window.location.href='../auth/login.html'" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-semibold shadow transition">
            Logout
          </button>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-6">
        <ul id="jobList" class="space-y-4">
            <!-- Jobs will render here like cards -->
        </ul>
      </div>
    </div>

    <script src="../js/technician.js"></script>
  </body>
</html>
